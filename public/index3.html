<!DOCTYPE html>
<html lang="pt-br">
   <head> 
    <meta charset="utf-8">
     <title>Login </title>
     <link rel="stylesheet" href="style.css">
     <script src="script.js" defer></script>
      <link href="https://unpkg.com/preact@10.5.0/dist/preact.min.js"
rel='stylesheet'> 

    </head>
     <body>
        <div class="blockmaster">
          <form>
              <div class="titulo">
                 <h1 >Login</h1>
              </div>
              <div class="caixaLogin">
                  <input type="email" id="username" placeholder="username"> 
                  <i class="bx bxs-user"></i>              
                </div>
              <div class="caixaLogin">
                 <input type="password" id="password" placeholder="password">
                 <i class="bx bxs-lock-alt"></i>             
                </div>  
              <div class="lembre-me">
                 <label><input type="checkbox">lembre-me</label>
                 <a href="#">Ajuda</a>
              </div>
              <div class="login-buttom">
                 <button id="loginbtn">login</button>   
              </div>
              <div class="resgitro">
                 <p>Não tenho conta?  <a href="#">Criar</a></p>
              </div>
          </form>
        </div>
  </body>
</html>
